# cargo-deny 0.20 policy. The exact crate allowlist deliberately mirrors
# Cargo.lock: every new or updated passenger requires an explicit review.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "deny"

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-workspace = true
allow = [
    { crate = "itoa@1.0.18", reason = "serde_json integer serialization" },
    { crate = "memchr@2.8.3", reason = "serde_json byte scanning" },
    { crate = "proc-macro2@1.0.107", reason = "serde derive support" },
    { crate = "quote@1.0.47", reason = "serde derive support" },
    { crate = "serde@1.0.229", reason = "SPEC section 12 serialization dependency" },
    { crate = "serde_core@1.0.229", reason = "serde and serde_json core" },
    { crate = "serde_derive@1.0.229", reason = "serde derive macros" },
    { crate = "serde_json@1.0.151", reason = "SPEC section 12 JSON dependency" },
    { crate = "syn@3.0.3", reason = "serde derive support" },
    { crate = "unicode-ident@1.0.24", reason = "serde derive identifier parsing" },
    { crate = "zmij@1.0.23", reason = "serde_json floating-point formatting" },
]
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
