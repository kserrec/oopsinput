[package]
name = "oopsinput"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Catches commands that probably aren't what you meant — before they run."
repository = "https://github.com/kserrec/oopsinput"

# Dependency policy: SPEC.md §12. Additions require a one-line defense there first.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
