name: Dependency policy

on:
  push:
  pull_request:
  schedule:
    # New advisories should be found even when the repository is idle.
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories, licenses, and crate allowlist
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        # actions/checkout v6.0.2, pinned so a mutable tag cannot change CI.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install verified cargo-deny
        shell: bash
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/cargo-deny.tar.gz"
          install_dir="${RUNNER_TEMP}/cargo-deny"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "${CARGO_DENY_SHA256}" "${archive}" \
            | sha256sum --check --strict
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Enforce dependency policy
        run: cargo-deny --locked check
