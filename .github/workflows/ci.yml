name: Build, test, and performance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.89.0"

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout v6.0.2, pinned so a mutable tag cannot change CI.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install PTY test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh bsdutils

      - name: Install minimum supported Rust with lint tools
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --profile minimal \
            --component rustfmt \
            --component clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  acceptance:
    name: Release acceptance gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout v6.0.2, pinned so a mutable tag cannot change CI.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install gate tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh bsdutils

      - name: Install minimum supported Rust
        run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal

      - name: Build release binary
        run: cargo build --release --locked

      - name: Exercise clean-machine lifecycle
        run: scripts/lifecycle-gate.zsh

      - name: Enforce binary latency budgets
        run: scripts/perf-gate.zsh

      - name: Enforce PTY buffer and latency gate
        run: scripts/pty-gate.zsh
