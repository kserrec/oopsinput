name: Publish verified Linux release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.89.0"

jobs:
  release:
    name: Build, attest, and publish x86_64 Linux archive
    if: github.repository == 'kserrec/oopsinput'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tagged source
        # actions/checkout v6.0.2, pinned so a mutable tag cannot change CI.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install release and PTY tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            bsdutils \
            musl-tools \
            zsh

      - name: Install the pinned Rust toolchain and musl target
        run: |
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --profile minimal \
            --target x86_64-unknown-linux-musl

      - name: Require the tag to match the package version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Build the static archive and checksum receipt
        run: scripts/build-release-bundle.zsh

      - name: Verify and exercise the shipped archive
        run: scripts/release-bundle-gate.zsh dist/oopsinput-*-x86_64-unknown-linux-musl.tar.gz

      - name: Generate GitHub build provenance
        # actions/attest v4.2.2, pinned so a mutable tag cannot change release CI.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "${{ github.workspace }}/dist/oopsinput-*-x86_64-unknown-linux-musl.tar.gz"

      - name: Publish the verified prerelease assets
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/oopsinput-*-x86_64-unknown-linux-musl.tar.gz \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "oopsinput ${GITHUB_REF_NAME}"
